name: siraj
description: "Islamic Application."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  hive: ^2.2.3
  intl: ^0.20.2
  sqflite: ^2.4.2
  freezed: ^2.5.2
  adhan: ^2.0.0+1
  location: ^8.0.1
  share_plus: ^12.0.1
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  fluttertoast: ^8.2.12
  hive_generator: ^2.0.1
  flutter_numkit: ^1.0.0
  cupertino_icons: ^1.0.8
  flutter_compass: ^0.8.1
  percent_indicator: ^4.2.5
  shared_preferences: ^2.5.3
  freezed_annotation: ^2.4.4
  loading_animation_widget: ^1.3.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_animate: ^4.5.2
  audioplayers: ^6.5.1
  http: ^1.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icons/launcher.png"

flutter:
  uses-material-design: true

  assets:
    - jsons/
    - assets/
    - assets/icons/
    - assets/images/
    - assets/icons/juzs/
    - assets/icons/surahs/

  fonts:
    - family: Arabic
      fonts:
        - asset: fonts/arabic/arabic.ttf
    - family: Number
      fonts:
        - asset: fonts/number/number.ttf
    - family: Quran
      fonts:
        - asset: fonts/quran/quran.ttf
